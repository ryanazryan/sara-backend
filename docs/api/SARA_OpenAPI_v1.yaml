components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FlexibleObject:
      type: object
      description: Module-specific patch body. See docs/api and Postman examples; this is a structural OpenAPI
        contract, not the complete field-level schema.
      additionalProperties: true
    AuthRegister:
      type: object
      required:
      - fullName
      - email
      - password
      - confirmPassword
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password
    AuthLogin:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    EmailOnly:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    OtpVerify:
      type: object
      required:
      - email
      - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^[0-9]{6}$
    KegiatanCreate:
      type: object
      required:
      - namaKegiatan
      properties:
        namaKegiatan:
          type: string
        deskripsi:
          type: string
        estimasiDurasi:
          type: integer
    ActivityCreate:
      type: object
      required:
      - namaAktivitas
      properties:
        namaAktivitas:
          type: string
          maxLength: 200
        idKegiatan:
          type: integer
          nullable: true
        waktuMulai:
          type: string
          format: date-time
          nullable: true
        waktuSelesai:
          type: string
          format: date-time
          nullable: true
        kategori:
          type: string
          nullable: true
        prioritas:
          type: string
          nullable: true
        lokasi:
          type: string
          nullable: true
        status:
          type: string
    ActivityPatch:
      type: object
      description: Partial ActivityCreate; moving start also shifts PENDING reminders or returns 409 if unsafe.
      properties:
        namaAktivitas:
          type: string
        idKegiatan:
          type: integer
          nullable: true
        waktuMulai:
          type: string
          format: date-time
          nullable: true
        waktuSelesai:
          type: string
          format: date-time
          nullable: true
        kategori:
          type: string
          nullable: true
        prioritas:
          type: string
          nullable: true
        lokasi:
          type: string
          nullable: true
        status:
          type: string
    StatusUpdate:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    ReminderCreate:
      type: object
      required:
      - triggerAt
      properties:
        triggerAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
    DeviceRegister:
      type: object
      required:
      - installationId
      - platform
      properties:
        installationId:
          type: string
        platform:
          type: string
        notificationPermission:
          type: string
        fcmToken:
          type: string
    NlpParse:
      type: object
      required:
      - text
      - timeZone
      properties:
        text:
          type: string
        timeZone:
          type: string
          example: Asia/Makassar
        locale:
          type: string
          example: id-ID
    NlpConfirm:
      type: object
      description: Optional validated overrides; empty object is valid.
      properties:
        overrides:
          type: object
          additionalProperties: true
    SmartSuggestion:
      type: object
      required:
      - activityId
      - windowStart
      - windowEnd
      properties:
        activityId:
          type: integer
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 480
        bufferMinutes:
          type: integer
          minimum: 0
          maximum: 120
        maxSuggestions:
          type: integer
    SmartConfirm:
      type: object
      required:
      - slotIndex
      properties:
        slotIndex:
          type: integer
          minimum: 0
    ApiEnvelope:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        data:
          description: Module-specific response payload
        message:
          type: string
        code:
          type: string
  responses:
    OK:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Created:
      description: Resource created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    NoContent:
      description: No response body
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Unauthorized:
      description: Missing/invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    NotFound:
      description: Owned resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Conflict:
      description: State or schedule conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
    ServerError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
