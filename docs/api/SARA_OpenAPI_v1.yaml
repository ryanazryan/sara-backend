# SARA Backend OpenAPI 3.0 — route inventory, PR #16
# Schemas are intentionally non-exhaustive; see module docs and validators.
openapi: 3.0.3
info:
  title: SARA Backend HTTP API
  version: 1.0.0-qa16
  description: 'Route-level OpenAPI inventory aligned with code and Postman at PR #15. Field-level validation,
    lifecycle constraints, and individual error codes are detailed in docs/api and validators; do not treat generic
    response schemas as exhaustive.'
servers:
- url: http://localhost:3000
  description: Local development (set your own server for deployment)
security:
- bearerAuth: []
tags:
- name: Health
- name: Authentication
- name: Kegiatan
- name: Aktivitas
- name: Schedule
- name: History
- name: Reminders
- name: Devices
- name: Notifications
- name: NLP
- name: Assistance
paths:
  /api/health:
    get:
      tags:
      - Health
      summary: Server health check
      operationId: getApiHealth
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
      security: []
  /api/ready:
    get:
      tags:
      - Health
      summary: Readiness check with MySQL connectivity
      operationId: getApiReady
      responses:
        '200':
          description: MySQL is reachable
        '503':
          description: MySQL is temporarily unavailable
      security: []
  /api/auth/register:
    post:
