name: sara

x-backend-env: &backend-env
  TZ: UTC
  PORT: "3000"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${MYSQL_DATABASE:-sara}
  DB_USER: ${MYSQL_USER:-sara_app}
  DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
  OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in .env.docker}
  NODE_ENV: ${NODE_ENV:-development}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
  NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}

services:
  mysql:
    image: mysql:8.0
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sara}
      MYSQL_USER: ${MYSQL_USER:-sara_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.docker}
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Local/CI standalone MySQL only: migrations 0007–0009 create triggers.
      # Avoid MySQL binary-log SUPER requirement. Not for replication/PITR deployment.
      - --skip-log-bin
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -Nse 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  migrate:
    image: sara-backend:local
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
    command: ["node", "dist/db/migrate.js", "up"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  api:
    image: sara-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SARA_API_PORT:-3000}:3000"
    healthcheck:
      # Liveness only. DB connectivity is checked separately.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    image: sara-backend:local
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # dispatchNotifications() also advances due reminders. Do not run a second scheduler.
    command: ["node", "dist/workers/notification.worker.js", "loop"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
